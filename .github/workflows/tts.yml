name: qwen3-tts-test
on: workflow_dispatch
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -y && sudo apt-get install -y sox ffmpeg
      - run: pip install -U qwen-tts soundfile numpy torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: free -g; nproc; python gen.py
      - run: ffmpeg -y -i out/test_full.wav -c:a libmp3lame -b:a 192k out/test_full.mp3
      - uses: actions/upload-artifact@v4
        with: { name: tts-out, path: out/ }
